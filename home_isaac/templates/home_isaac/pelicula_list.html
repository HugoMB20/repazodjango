{% extends 'base.html' %}
{% load static %}

{% block title %}{{ titulo_genero }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>{{ titulo_genero }}</h2>
    <a href="{% url 'home:inicio' %}" class="btn btn-outline-secondary">← Volver a Géneros</a>
</div>

<!-- Tarjetas de Bootstrap para las películas -->
<div class="row g-4">
    {% for pelicula in peliculas %}
    <div class="col-md-6 col-lg-4">
        <div class="card h-100 shadow">
            <!-- Renderizado de imagen desde static/images/ -->
            <img src="{% static 'images/' %}{{ pelicula.imagen }}" class="card-img-top" alt="{{ pelicula.nombre }}" style="height: 250px; object-fit: cover;">
            <div class="card-body d-flex flex-column">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h5 class="card-title mb-0">{{ pelicula.nombre }}</h5>
                    <span class="badge bg-danger fs-6">{{ pelicula.edad }}</span>
                </div>
                <p class="card-text text-muted flex-grow-1">{{ pelicula.descripcion }}</p>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
