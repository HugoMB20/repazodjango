{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CineApp{% endblock %}</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Estilos Personalizados CineApp -->
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>
<body class="cine-body d-flex flex-column min-vh-100">

    <!-- Navbar Cinemático -->
    <nav class="navbar navbar-expand-lg cine-navbar">
        <div class="container">
            <!-- Brand / Logo -->
            <a class="cine-brand" href="{% url 'home:inicio' %}">
                <img src="{% static 'images/logo-icon.png' %}" alt="CineApp Logo">
                <span>CineApp</span>
            </a>

            <!-- Botón Hamburguesa Móvil -->
            <button class="navbar-toggler border-secondary text-light" type="button" data-bs-toggle="collapse" data-bs-target="#cineNavbarNav">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>

            <!-- Links y Controles -->
            <div class="collapse navbar-collapse" id="cineNavbarNav">
                <!-- Enlaces Principales -->
                <ul class="navbar-nav ms-lg-4 me-auto align-items-lg-center">
                    <li class="nav-item">
                        <a class="cine-nav-link {% if request.resolver_match.url_name == 'inicio' %}active{% endif %}" href="{% url 'home:inicio' %}">
                            <i class="bi bi-house-door-fill text-primary"></i>
                            <span>Inicio</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="cine-nav-link" href="{% url 'home:inicio' %}#generos">
                            <i class="bi bi-collection-play-fill"></i>
                            <span>Géneros</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="cine-nav-link {% if request.resolver_match.url_name == 'genero_accion' %}active{% endif %}" href="{% url 'home:genero_accion' %}">
                            <i class="bi bi-camera-reels-fill"></i>
                            <span>Acción</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="cine-nav-link {% if request.resolver_match.url_name == 'genero_scifi' %}active{% endif %}" href="{% url 'home:genero_scifi' %}">
                            <i class="bi bi-rocket-takeoff-fill"></i>
                            <span>Ciencia Ficción</span>
                        </a>
                    </li>
                </ul>

                <!-- Buscador e Íconos Secundarios -->
                <div class="d-flex align-items-center gap-2 mt-3 mt-lg-0">
                    <div class="cine-search-box d-none d-md-block">
                        <i class="bi bi-search"></i>
                        <input type="text" placeholder="Buscar películas..." aria-label="Buscar">
                    </div>
                    <button class="cine-icon-btn d-none d-sm-inline-flex" type="button" title="Modo Claro/Oscuro">
                        <i class="bi bi-sun"></i>
                    </button>
                    <button class="cine-icon-btn d-none d-sm-inline-flex" type="button" title="Notificaciones">
                        <i class="bi bi-bell"></i>
                    </button>
                    <button class="cine-icon-btn" type="button" title="Perfil">
                        <i class="bi bi-person-circle"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="container my-4 flex-grow-1 d-flex flex-column justify-content-center">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer Cinemático -->
    <footer class="cine-footer text-center">
        <div class="container">
            <p>
                <i class="bi bi-film"></i>
                <span>&copy; 2026 Evaluación Sumativa 2 - Desarrollo Web Django</span>
            </p>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/scripts.js' %}"></script>
</body>
</html>
